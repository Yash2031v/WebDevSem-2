<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.Tech DSA - Sorting Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="visualizer-container">
        <h2>DSA Sorting Visualizer 📊</h2>
        
        <div class="control-panel">
            <button id="generate-btn">Generate New Array</button>
            <button id="bubble-btn">Bubble Sort</button>
            <button id="selection-btn">Selection Sort</button>
        </div>

        <div class="bar-container" id="stage"></div>
        
        <p class="info-text">Blue: Unsorted | Red: Comparing | Green: Sorted</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
